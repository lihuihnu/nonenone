name: Audit cell 540 SW residual Jacobian

on:
  push:
    branches:
      - audit/cell540-rj-20260917
    paths:
      - .github/workflows/cell540-sw-residual-jacobian-audit.yml
      - tools/inject_cell540_residual_jacobian_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/cell540-rj-20260917

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran python3 curl ca-certificates \
            openmpi-bin libopenmpi-dev \
            libblas-dev liblapack-dev libmetis-dev libfmt-dev

      - name: Set PETSc environment
        run: |
          echo "PETSC_DIR=${RUNNER_TEMP}/petsc-3.22.2" >> "${GITHUB_ENV}"
          echo "PETSC_ARCH=arch-ci" >> "${GITHUB_ENV}"

      - name: Restore PETSc cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/petsc-3.22.2
          key: petsc-3.22.2-ubuntu24-openmpi4-gcc13-v1

      - name: Configure runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          git config core.filemode false
          find scripts -type f -name '*.sh' -exec chmod +x {} +
          METIS_ROOT="${RUNNER_TEMP}/metis-shim"
          mkdir -p "${METIS_ROOT}/include" "${METIS_ROOT}/install/lib"
          ln -sf /usr/include/metis.h "${METIS_ROOT}/include/metis.h"
          METIS_LIB="$(ldconfig -p | awk '/libmetis\.so/{print $NF; exit}')"
          test -n "${METIS_LIB}"
          ln -sf "${METIS_LIB}" "${METIS_ROOT}/install/lib/libmetis.so"
          DQ_MESH_DIR="${RUNNER_TEMP}/DQ_data"
          mkdir -p "${DQ_MESH_DIR}"
          cat > config/hpc.local.mk <<EOF
          MPMC_PLATFORM := local
          PETSC_DIR := ${PETSC_DIR}
          PETSC_ARCH := ${PETSC_ARCH}
          FMT_DIR := /usr
          METIS_DIR := ${METIS_ROOT}
          VTK_INSTALL :=
          X11_LIB_DIR := /usr/lib/x86_64-linux-gnu
          LOCAL_LIB_DIR := /usr/local/lib
          MPI_LAUNCHER := mpiexec
          MPI_LAUNCHER_ARGS :=
          MODULES_ENABLED := 0
          PETSC_CUSTOM_HOOK_LINKAGE := both
          MPI_MODULE :=
          BLAS_MODULE :=
          SBATCH :=
          DQ_MESH_DIR := ${DQ_MESH_DIR}
          EOF
          make doctor-local

      - name: Inject residual Jacobian audit
        run: python3 tools/inject_cell540_residual_jacobian_audit.py

      - name: Build case
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          sed -i 's/^clean::$/mpmc-ci-clean:/' case/Makefile
          make case CASE=scw_kerogen_lmh_2d -j2

      - name: Run through cell 540 barrier
        shell: bash
        run: |
          set -o pipefail
          mkdir -p runner-results/cell540-rj
          set +e
          timeout --signal=TERM --kill-after=20s 300s \
            make run CASE=scw_kerogen_lmh_2d NP=1 EOS=sw \
              RESULT_DIR="${GITHUB_WORKSPACE}/runner-results/cell540-rj" \
              RUN_ARGS='-ksp_type preonly -pc_type lu' \
            2>&1 | tee runner-results/cell540-rj/console.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" > runner-results/cell540-rj/run_status.txt
          grep -E '^\[CELL540-RJ-' runner-results/cell540-rj/console.log \
            > runner-results/cell540-rj/residual_jacobian_audit.log || true
          tail -n 160 runner-results/cell540-rj/residual_jacobian_audit.log || true
          exit 0

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cell540-sw-residual-jacobian-audit
          path: runner-results/cell540-rj
          if-no-files-found: warn
