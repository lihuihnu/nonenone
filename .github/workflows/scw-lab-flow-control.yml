name: SCW lab flow-control contract

on:
  push:
    branches:
      - docs/scw-kerogen-acs2023-data
    paths:
      - 'case/scw_kerogen_common/lab_flow_scaling.hpp'
      - 'case/scw_kerogen_lumped_flow_study/13_LAB_FLOW_CONTROL_AND_PVI.md'
      - 'case/scw_kerogen_lumped_flow_study/porous_media/flow_control_*.csv'
      - 'case/scw_kerogen_lumped_flow_study/porous_media/darcy_flow_scale.csv'
      - 'test/src/unit/lab_flow_control_contract_test.cpp'
      - 'test/Makefile'
      - '.github/workflows/scw-lab-flow-control.yml'
  pull_request:
    paths:
      - 'case/scw_kerogen_common/lab_flow_scaling.hpp'
      - 'case/scw_kerogen_lumped_flow_study/13_LAB_FLOW_CONTROL_AND_PVI.md'
      - 'case/scw_kerogen_lumped_flow_study/porous_media/flow_control_*.csv'
      - 'case/scw_kerogen_lumped_flow_study/porous_media/darcy_flow_scale.csv'
      - 'test/src/unit/lab_flow_control_contract_test.cpp'
      - 'test/Makefile'
      - '.github/workflows/scw-lab-flow-control.yml'

jobs:
  flow-control-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run focused flow-control regression
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror             -Iad/include -Icommon/include -Iindices/include -Imodels/include             -Icase/include -Itest/include -Itools/include             test/src/unit/lab_flow_control_contract_test.cpp             -o /tmp/lab_flow_control_contract_test
          /tmp/lab_flow_control_contract_test

      - name: Validate flow-control CSV shapes
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          files = [
              Path('case/scw_kerogen_lumped_flow_study/porous_media/flow_control_contract.csv'),
              Path('case/scw_kerogen_lumped_flow_study/porous_media/flow_control_gate.csv'),
              Path('case/scw_kerogen_lumped_flow_study/porous_media/darcy_flow_scale.csv'),
          ]
          for path in files:
              with path.open(newline='', encoding='utf-8') as f:
                  rows = list(csv.reader(f))
              assert rows and rows[0], f'{path}: missing header'
              width = len(rows[0])
              bad = [i + 1 for i, row in enumerate(rows) if len(row) != width]
              assert not bad, f'{path}: inconsistent column count at rows {bad}'
              print(f'[PASS] {path}: {len(rows)-1} data rows, {width} columns')
          PY

      - name: Check documentation links
        run: python3 scripts/check_markdown_links.py
