name: Audit cell 540 raw SW reflash

on:
  push:
    branches:
      - run/minority-amount-lmh2d-20260917
    paths:
      - .github/workflows/cell540-water-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cell540-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran python3 curl ca-certificates \
            openmpi-bin libopenmpi-dev \
            libblas-dev liblapack-dev libmetis-dev libfmt-dev

      - name: Set PETSc environment
        run: |
          echo "PETSC_DIR=${RUNNER_TEMP}/petsc-3.22.2" >> "${GITHUB_ENV}"
          echo "PETSC_ARCH=arch-ci" >> "${GITHUB_ENV}"

      - name: Restore PETSc 3.22.2 cache
        id: petsc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/petsc-3.22.2
          key: petsc-3.22.2-ubuntu24-openmpi4-gcc13-v1

      - name: Build PETSc 3.22.2 on cache miss
        if: steps.petsc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PETSC_VERSION=3.22.2
          curl -fL --retry 3 \
            "https://web.cels.anl.gov/projects/petsc/download/release-snapshots/petsc-${PETSC_VERSION}.tar.gz" \
            -o "${RUNNER_TEMP}/petsc-${PETSC_VERSION}.tar.gz"
          tar -xzf "${RUNNER_TEMP}/petsc-${PETSC_VERSION}.tar.gz" -C "${RUNNER_TEMP}"
          cd "${PETSC_DIR}"
          ./configure PETSC_ARCH="${PETSC_ARCH}" \
            --with-debugging=0 --with-shared-libraries=1 --with-mpi=1 \
            --with-fortran-bindings=0 --with-x=0
          make PETSC_DIR="${PETSC_DIR}" PETSC_ARCH="${PETSC_ARCH}" all -j2

      - name: Configure runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          git config core.filemode false
          find scripts -type f -name '*.sh' -exec chmod +x {} +
          METIS_ROOT="${RUNNER_TEMP}/metis-shim"
          mkdir -p "${METIS_ROOT}/include" "${METIS_ROOT}/install/lib"
          ln -sf /usr/include/metis.h "${METIS_ROOT}/include/metis.h"
          METIS_LIB="$(ldconfig -p | awk '/libmetis\.so/{print $NF; exit}')"
          test -n "${METIS_LIB}"
          ln -sf "${METIS_LIB}" "${METIS_ROOT}/install/lib/libmetis.so"
          DQ_MESH_DIR="${RUNNER_TEMP}/DQ_data"
          mkdir -p "${DQ_MESH_DIR}"
          cat > config/hpc.local.mk <<EOF
          MPMC_PLATFORM := local
          PETSC_DIR := ${PETSC_DIR}
          PETSC_ARCH := ${PETSC_ARCH}
          FMT_DIR := /usr
          METIS_DIR := ${METIS_ROOT}
          VTK_INSTALL :=
          X11_LIB_DIR := /usr/lib/x86_64-linux-gnu
          LOCAL_LIB_DIR := /usr/local/lib
          MPI_LAUNCHER := mpiexec
          MPI_LAUNCHER_ARGS :=
          MODULES_ENABLED := 0
          PETSC_CUSTOM_HOOK_LINKAGE := both
          MPI_MODULE :=
          BLAS_MODULE :=
          SBATCH :=
          DQ_MESH_DIR := ${DQ_MESH_DIR}
          EOF
          make doctor-local

      - name: Inject read-only raw reflash diagnostics
        run: python3 tools/inject_cell540_reflash_audit.py

      - name: Build instrumented LMH 2D case
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^clean::$/mpmc-ci-clean:/' case/Makefile
          make case CASE=scw_kerogen_lmh_2d -j2

      - name: Run SW audit with 10-minute numerical cap
        shell: bash
        run: |
          set -o pipefail
          mkdir -p runner-results/cell540-reflash
          set +e
          timeout --signal=TERM --kill-after=30s 600s \
            make run CASE=scw_kerogen_lmh_2d NP=1 EOS=sw \
              RESULT_DIR="${GITHUB_WORKSPACE}/runner-results/cell540-reflash" \
              RUN_ARGS='-ksp_type preonly -pc_type lu' \
            2>&1 | tee runner-results/cell540-reflash/console.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" | tee runner-results/cell540-reflash/run_status.txt
          if [[ ${rc} -eq 124 || ${rc} -eq 137 || ${rc} -eq 143 ]]; then
            echo "timed_out=true" | tee -a runner-results/cell540-reflash/run_status.txt
          else
            echo "timed_out=false" | tee -a runner-results/cell540-reflash/run_status.txt
          fi
          exit ${rc}

      - name: Extract focused audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^\[CELL540-(TPD|REFLASH|ACTIVE)\]' \
            runner-results/cell540-reflash/console.log \
            > runner-results/cell540-reflash/cell540_reflash_audit.log || true
          echo '===== CELL540 RAW REFLASH AUDIT ====='
          tail -n 400 runner-results/cell540-reflash/cell540_reflash_audit.log || true
          echo '===== STEP HISTORY ====='
          tail -n 80 runner-results/cell540-reflash/time_step_history.csv 2>/dev/null || true
          echo '===== STATUS ====='
          cat runner-results/cell540-reflash/run_status.txt 2>/dev/null || true

      - name: Upload focused audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cell540-raw-reflash-audit
          path: runner-results/cell540-reflash
          if-no-files-found: warn
