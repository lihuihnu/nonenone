name: Validate CPA dependent-composition snapping

on:
  push:
    branches:
      - test/cpa-dependent-snap-revert-20260917
    paths:
      - .github/workflows/cpa-dependent-snap-regression.yml
      - tools/inject_historical_cpa_dependent_snap.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 9

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran python3 curl ca-certificates \
            openmpi-bin libopenmpi-dev libblas-dev liblapack-dev libmetis-dev libfmt-dev

      - name: Set PETSc environment
        run: |
          echo "PETSC_DIR=${RUNNER_TEMP}/petsc-3.22.2" >> "${GITHUB_ENV}"
          echo "PETSC_ARCH=arch-ci" >> "${GITHUB_ENV}"

      - name: Restore PETSc cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/petsc-3.22.2
          key: petsc-3.22.2-ubuntu24-openmpi4-gcc13-v1

      - name: Configure runner
        shell: bash
        run: |
          set -euo pipefail
          git config core.filemode false
          find scripts -type f -name '*.sh' -exec chmod +x {} +
          METIS_ROOT="${RUNNER_TEMP}/metis-shim"
          mkdir -p "${METIS_ROOT}/include" "${METIS_ROOT}/install/lib"
          ln -sf /usr/include/metis.h "${METIS_ROOT}/include/metis.h"
          METIS_LIB="$(ldconfig -p | awk '/libmetis\.so/{print $NF; exit}')"
          test -n "${METIS_LIB}"
          ln -sf "${METIS_LIB}" "${METIS_ROOT}/install/lib/libmetis.so"
          DQ_MESH_DIR="${RUNNER_TEMP}/DQ_data"
          mkdir -p "${DQ_MESH_DIR}"
          cat > config/hpc.local.mk <<EOF
          MPMC_PLATFORM := local
          PETSC_DIR := ${PETSC_DIR}
          PETSC_ARCH := ${PETSC_ARCH}
          FMT_DIR := /usr
          METIS_DIR := ${METIS_ROOT}
          VTK_INSTALL :=
          X11_LIB_DIR := /usr/lib/x86_64-linux-gnu
          LOCAL_LIB_DIR := /usr/local/lib
          MPI_LAUNCHER := mpiexec
          MPI_LAUNCHER_ARGS :=
          MODULES_ENABLED := 0
          PETSC_CUSTOM_HOOK_LINKAGE := both
          MPI_MODULE :=
          BLAS_MODULE :=
          SBATCH :=
          DQ_MESH_DIR := ${DQ_MESH_DIR}
          EOF
          make doctor-local

      - name: Restore historical dependent snapping in runner copy
        run: python3 tools/inject_historical_cpa_dependent_snap.py

      - name: Build LMH 2D
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^clean::$/mpmc-ci-clean:/' case/Makefile
          make case CASE=scw_kerogen_lmh_2d -j2

      - name: Run CPA beyond current 0.020766 day barrier
        shell: bash
        run: |
          set -o pipefail
          mkdir -p runner-results/cpa-snap
          set +e
          timeout --signal=TERM --kill-after=20s 420s \
            make run CASE=scw_kerogen_lmh_2d NP=1 EOS=cpa \
              RESULT_DIR="${GITHUB_WORKSPACE}/runner-results/cpa-snap" \
              RUN_ARGS='-ksp_type preonly -pc_type lu' \
            2>&1 | tee runner-results/cpa-snap/console.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" > runner-results/cpa-snap/run_status.txt
          python3 - <<'PY'
          from pathlib import Path
          import csv
          p = Path('runner-results/cpa-snap/time_step_history.csv')
          mx = 0.0
          if p.exists():
              with p.open() as f:
                  rows = list(csv.DictReader(f))
              for row in rows:
                  for key in ('time_day','time_days','time','t_day'):
                      if key in row and row[key]:
                          try: mx=max(mx,float(row[key]))
                          except ValueError: pass
          print(f'max_accepted_day={mx:.17g}')
          Path('runner-results/cpa-snap/max_time.txt').write_text(f'{mx:.17g}\n')
          PY
          exit 0

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpa-dependent-snap-regression
          path: runner-results/cpa-snap
          if-no-files-found: warn
