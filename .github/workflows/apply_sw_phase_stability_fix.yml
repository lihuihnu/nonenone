name: Apply SW phase stability fix

on:
  push:
    branches:
      - fix/sw-phase-stability-transition

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited SW thermodynamic patch
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 --batch --forward < .ci/sw_phase_stability_fix.patch
          test "$(git hash-object models/include/natural/thermo/three_phase_flash.hpp)" = "8dbe5a54c81068c7dbee8d91d82140819b10da64"
          test "$(git hash-object test/src/unit/sw_phase_ordering_test.cpp)" = "527e6ae7cc8e40c8a0ac561a380e34916fc1cd41"
          git diff --check

      - name: Commit clean source change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ci/sw_phase_stability_fix.patch
          rm -f .github/workflows/apply_sw_phase_stability_fix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: stabilize SW phase transitions and TPD reference"
          git push origin HEAD:fix/sw-phase-stability-transition
