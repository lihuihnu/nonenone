name: Validate SW phase stability fix

on:
  push:
    branches:
      - fix/sw-phase-stability-transition
    paths:
      - .github/workflows/sw-phase-stability-validation.yml

permissions:
  contents: read

jobs:
  sw-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran python3 curl ca-certificates \
            openmpi-bin libopenmpi-dev \
            libblas-dev liblapack-dev libmetis-dev libfmt-dev

      - name: Set PETSc environment
        run: |
          echo "PETSC_DIR=${RUNNER_TEMP}/petsc-3.22.2" >> "${GITHUB_ENV}"
          echo "PETSC_ARCH=arch-ci" >> "${GITHUB_ENV}"

      - name: Restore PETSc 3.22.2 cache
        id: petsc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/petsc-3.22.2
          key: petsc-3.22.2-ubuntu24-openmpi4-gcc13-v1

      - name: Build PETSc 3.22.2 on cache miss
        if: steps.petsc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PETSC_VERSION=3.22.2
          curl -fL --retry 3 \
            "https://web.cels.anl.gov/projects/petsc/download/release-snapshots/petsc-${PETSC_VERSION}.tar.gz" \
            -o "${RUNNER_TEMP}/petsc-${PETSC_VERSION}.tar.gz"
          tar -xzf "${RUNNER_TEMP}/petsc-${PETSC_VERSION}.tar.gz" -C "${RUNNER_TEMP}"
          cd "${PETSC_DIR}"
          ./configure PETSC_ARCH="${PETSC_ARCH}" \
            --with-debugging=0 --with-shared-libraries=1 --with-mpi=1 \
            --with-fortran-bindings=0 --with-x=0
          make PETSC_DIR="${PETSC_DIR}" PETSC_ARCH="${PETSC_ARCH}" all -j2

      - name: Configure local dependency profile
        shell: bash
        run: |
          set -euo pipefail
          git config core.filemode false
          find scripts -type f -name '*.sh' -exec chmod +x {} +
          METIS_ROOT="${RUNNER_TEMP}/metis-shim"
          mkdir -p "${METIS_ROOT}/include" "${METIS_ROOT}/install/lib"
          ln -sf /usr/include/metis.h "${METIS_ROOT}/include/metis.h"
          METIS_LIB="$(ldconfig -p | awk '/libmetis\.so/{print $NF; exit}')"
          test -n "${METIS_LIB}"
          ln -sf "${METIS_LIB}" "${METIS_ROOT}/install/lib/libmetis.so"
          DQ_MESH_DIR="${RUNNER_TEMP}/DQ_data"
          mkdir -p "${DQ_MESH_DIR}"
          cat > config/hpc.local.mk <<EOF
          MPMC_PLATFORM := local
          PETSC_DIR := ${PETSC_DIR}
          PETSC_ARCH := ${PETSC_ARCH}
          FMT_DIR := /usr
          METIS_DIR := ${METIS_ROOT}
          VTK_INSTALL :=
          X11_LIB_DIR := /usr/lib/x86_64-linux-gnu
          LOCAL_LIB_DIR := /usr/local/lib
          MPI_LAUNCHER := mpiexec
          MPI_LAUNCHER_ARGS :=
          MODULES_ENABLED := 0
          PETSC_CUSTOM_HOOK_LINKAGE := both
          MPI_MODULE :=
          BLAS_MODULE :=
          SBATCH :=
          DQ_MESH_DIR := ${DQ_MESH_DIR}
          EOF
          make doctor-local

      - name: Inject read-only dominant-residual diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          diagnostics = Path('models/include/natural/petsc/natural_runtime_diagnostics.hpp')
          text = diagnostics.read_text()
          old = '''    double maximumAbsoluteMassResidual{0.0};
              PetscInt currentCellId{-1};'''
          new = '''    double maximumAbsoluteMassResidual{0.0};
              // Raw PETSc residual as seen by SNES, including configured row scaling.
              double maximumAbsoluteResidual{0.0};
              double maximumResidualValue{0.0};
              PetscInt maximumResidualCellId{-1};
              PetscInt maximumResidualInputCellId{-1};
              int maximumResidualEquation{-1};
              PetscInt currentCellId{-1};'''
          if old not in text:
              raise SystemExit('diagnostic struct anchor not found')
          diagnostics.write_text(text.replace(old, new, 1))

          implementation = Path('models/include/natural/petsc/detail/natural_petsc_runtime_failure_diagnostics.inc')
          text = implementation.read_text()
          old = '''        PetscOwnedReadView residualView(residual);

              // 只在组分质量守恒行中寻找全局最大值；这是本诊断的唯一目标。'''
          new = '''        PetscOwnedReadView residualView(residual);

              // Diagnostic-only: identify the largest raw PETSc residual over every
              // equation row.  This is the same scaled residual vector used by SNES.
              double localAllMaximum = -1.0;
              double localAllValue = 0.0;
              Cell localAllCell = Cell(-1);
              int localAllEquation = -1;
              for (const Cell cell : ownedCells_)
              {
                  for (int equation = 0; equation < Indices::numEquations; ++equation)
                  {
                      const PetscInt global = map.globalIndex(cell, equation);
                      if (global < residualView.begin() || global >= residualView.end())
                          throw std::runtime_error(
                              "Owned Natural residual row is outside PETSc ownership range.");
                      const double value = PetscRealPart(
                          residualView.data()[global - residualView.begin()]);
                      const double magnitude = std::abs(value);
                      if (magnitude > localAllMaximum)
                      {
                          localAllMaximum = magnitude;
                          localAllValue = value;
                          localAllCell = cell;
                          localAllEquation = equation;
                      }
                  }
              }

              double globalAllMaximum = -1.0;
              PetscCallMPIAbort(
                  comm,
                  MPI_Allreduce(&localAllMaximum, &globalAllMaximum, 1,
                                MPI_DOUBLE, MPI_MAX, comm));
              int allCandidateRank = localAllMaximum == globalAllMaximum
                  ? static_cast<int>(rank)
                  : std::numeric_limits<int>::max();
              int allWinningRank = 0;
              PetscCallMPIAbort(
                  comm,
                  MPI_Allreduce(&allCandidateRank, &allWinningRank, 1,
                                MPI_INT, MPI_MIN, comm));
              PetscInt allWinningCell = -1;
              PetscInt allWinningInputCell = -1;
              int allWinningEquation = -1;
              double allWinningValue = 0.0;
              if (static_cast<int>(rank) == allWinningRank)
              {
                  allWinningCell = static_cast<PetscInt>(localAllCell);
                  allWinningInputCell = backend_.inputCellIndex(localAllCell);
                  allWinningEquation = localAllEquation;
                  allWinningValue = localAllValue;
              }
              PetscCallMPIAbort(comm, MPI_Bcast(
                  &allWinningCell, 1, MPIU_INT, allWinningRank, comm));
              PetscCallMPIAbort(comm, MPI_Bcast(
                  &allWinningInputCell, 1, MPIU_INT, allWinningRank, comm));
              PetscCallMPIAbort(comm, MPI_Bcast(
                  &allWinningEquation, 1, MPI_INT, allWinningRank, comm));
              PetscCallMPIAbort(comm, MPI_Bcast(
                  &allWinningValue, 1, MPI_DOUBLE, allWinningRank, comm));
              diagnostic.maximumAbsoluteResidual = globalAllMaximum;
              diagnostic.maximumResidualValue = allWinningValue;
              diagnostic.maximumResidualCellId = allWinningCell;
              diagnostic.maximumResidualInputCellId = allWinningInputCell;
              diagnostic.maximumResidualEquation = allWinningEquation;

              // 只在组分质量守恒行中寻找全局最大值；这是本诊断的唯一目标。'''
          if old not in text:
              raise SystemExit('failure diagnostic implementation anchor not found')
          implementation.write_text(text.replace(old, new, 1))

          output = Path('case/include/case/failure_diagnostics.hpp')
          text = output.read_text()
          old = '''        PetscPrintf(PETSC_COMM_SELF,
                          "  SNES reason                  : %s\\n",
                          result.reason.empty() ? "unknown" : result.reason.c_str());
              PetscPrintf(PETSC_COMM_SELF,
                          "  max component |R|           : %.12e  component=%s\\n",'''
          new = '''        PetscPrintf(PETSC_COMM_SELF,
                          "  SNES reason                  : %s\\n",
                          result.reason.empty() ? "unknown" : result.reason.c_str());
              PetscPrintf(PETSC_COMM_SELF,
                          "  max all-equation |R|         : %.12e  raw=% .12e  cell=%lld/%lld  equation=%d\\n",
                          d.maximumAbsoluteResidual,
                          d.maximumResidualValue,
                          static_cast<long long>(d.maximumResidualCellId),
                          static_cast<long long>(d.maximumResidualInputCellId),
                          d.maximumResidualEquation);
              PetscPrintf(PETSC_COMM_SELF,
                          "  max component |R|           : %.12e  component=%s\\n",'''
          if old not in text:
              raise SystemExit('failure diagnostic output anchor not found')
          output.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Full unit regression
        run: make unit-gcc

      - name: Build H2O-CO2-nC10 benchmark
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^clean::$/mpmc-ci-clean:/' case/Makefile
          make case CASE=h2o_co2_nc10_2d_benchmark -j2

      - name: Run New-SW short step
        run: |
          make run CASE=h2o_co2_nc10_2d_benchmark NP=1 EOS=sw \
            RESULT_DIR="${GITHUB_WORKSPACE}/runner-results/new-sw" \
            RUN_ARGS='-numSteps 1 -dt 0.01 -adaptive_dt false'

      - name: Show SW numerical summaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            runner-results/new-sw/nonlinear_solve_history.csv \
            runner-results/new-sw/time_step_history.csv \
            runner-results/new-sw/component_mass_balance.csv \
            runner-results/new-sw/simulation_summary.csv; do
            if [[ -f "$f" ]]; then
              echo "===== $f ====="
              cat "$f"
            fi
          done
