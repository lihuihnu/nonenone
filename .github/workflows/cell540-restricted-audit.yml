name: Audit cell 540 restricted SW candidates

on:
  push:
    branches:
      - run/minority-amount-lmh2d-20260917
    paths:
      - .github/workflows/cell540-restricted-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran python3 curl ca-certificates openmpi-bin libopenmpi-dev libblas-dev liblapack-dev libmetis-dev libfmt-dev
      - run: |
          echo "PETSC_DIR=${RUNNER_TEMP}/petsc-3.22.2" >> "$GITHUB_ENV"
          echo "PETSC_ARCH=arch-ci" >> "$GITHUB_ENV"
      - id: petsc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/petsc-3.22.2
          key: petsc-3.22.2-ubuntu24-openmpi4-gcc13-v1
      - if: steps.petsc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://web.cels.anl.gov/projects/petsc/download/release-snapshots/petsc-3.22.2.tar.gz -o ${RUNNER_TEMP}/petsc.tar.gz
          tar -xzf ${RUNNER_TEMP}/petsc.tar.gz -C ${RUNNER_TEMP}
          cd ${PETSC_DIR}
          ./configure PETSC_ARCH=${PETSC_ARCH} --with-debugging=0 --with-shared-libraries=1 --with-mpi=1 --with-fortran-bindings=0 --with-x=0
          make PETSC_DIR=${PETSC_DIR} PETSC_ARCH=${PETSC_ARCH} all -j2
      - shell: bash
        run: |
          set -euo pipefail
          git config core.filemode false
          find scripts -type f -name '*.sh' -exec chmod +x {} +
          METIS_ROOT=${RUNNER_TEMP}/metis-shim
          mkdir -p ${METIS_ROOT}/include ${METIS_ROOT}/install/lib ${RUNNER_TEMP}/DQ_data
          ln -sf /usr/include/metis.h ${METIS_ROOT}/include/metis.h
          METIS_LIB=$(ldconfig -p | awk '/libmetis\.so/{print $NF; exit}')
          ln -sf ${METIS_LIB} ${METIS_ROOT}/install/lib/libmetis.so
          cat > config/hpc.local.mk <<EOF
          MPMC_PLATFORM := local
          PETSC_DIR := ${PETSC_DIR}
          PETSC_ARCH := ${PETSC_ARCH}
          FMT_DIR := /usr
          METIS_DIR := ${METIS_ROOT}
          VTK_INSTALL :=
          X11_LIB_DIR := /usr/lib/x86_64-linux-gnu
          LOCAL_LIB_DIR := /usr/local/lib
          MPI_LAUNCHER := mpiexec
          MPI_LAUNCHER_ARGS :=
          MODULES_ENABLED := 0
          PETSC_CUSTOM_HOOK_LINKAGE := both
          DQ_MESH_DIR := ${RUNNER_TEMP}/DQ_data
          EOF
          python3 tools/inject_cell540_reflash_audit.py
          sed -i 's/^clean::$/mpmc-ci-clean:/' case/Makefile
          make case CASE=scw_kerogen_lmh_2d -j2
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p runner-results/cell540-restricted
          set +e
          timeout --signal=TERM --kill-after=30s 600s make run CASE=scw_kerogen_lmh_2d NP=1 EOS=sw RESULT_DIR="${GITHUB_WORKSPACE}/runner-results/cell540-restricted" RUN_ARGS='-ksp_type preonly -pc_type lu' 2>&1 | tee runner-results/cell540-restricted/console.log
          rc=${PIPESTATUS[0]}
          set -e
          echo exit_code=${rc} | tee runner-results/cell540-restricted/run_status.txt
          grep -E '^\[CELL540-(TPD|REFLASH|RESTRICTED|ACTIVE)\]' runner-results/cell540-restricted/console.log > runner-results/cell540-restricted/audit.log || true
          tail -n 500 runner-results/cell540-restricted/audit.log || true
          exit ${rc}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cell540-high-precision-restricted-audit
          path: runner-results/cell540-restricted
          if-no-files-found: warn
