name: H2O-CO2-nC10 smoke cases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/h2o-co2-nc10-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran python3 curl ca-certificates \
            openmpi-bin libopenmpi-dev \
            libblas-dev liblapack-dev libmetis-dev libfmt-dev

      - name: Set PETSc environment
        run: |
          echo "PETSC_DIR=${RUNNER_TEMP}/petsc-3.22.2" >> "${GITHUB_ENV}"
          echo "PETSC_ARCH=arch-ci" >> "${GITHUB_ENV}"

      - name: Restore PETSc 3.22.2 cache
        id: petsc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/petsc-3.22.2
          key: petsc-3.22.2-ubuntu24-openmpi4-gcc13-v1

      - name: Build PETSc 3.22.2
        if: steps.petsc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PETSC_VERSION=3.22.2
          curl -fL --retry 3 \
            "https://web.cels.anl.gov/projects/petsc/download/release-snapshots/petsc-${PETSC_VERSION}.tar.gz" \
            -o "${RUNNER_TEMP}/petsc-${PETSC_VERSION}.tar.gz"
          tar -xzf "${RUNNER_TEMP}/petsc-${PETSC_VERSION}.tar.gz" -C "${RUNNER_TEMP}"
          cd "${PETSC_DIR}"
          ./configure PETSC_ARCH="${PETSC_ARCH}" \
            --with-debugging=0 \
            --with-shared-libraries=1 \
            --with-mpi=1 \
            --with-fortran-bindings=0 \
            --with-x=0
          make PETSC_DIR="${PETSC_DIR}" PETSC_ARCH="${PETSC_ARCH}" all -j2

      - name: Save PETSc 3.22.2 cache
        if: steps.petsc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/petsc-3.22.2
          key: ${{ steps.petsc-cache.outputs.cache-primary-key }}

      - name: Configure local dependency profile
        shell: bash
        run: |
          set -euo pipefail
          git config core.filemode false
          find scripts -type f -name '*.sh' -exec chmod +x {} +

          METIS_ROOT="${RUNNER_TEMP}/metis-shim"
          mkdir -p "${METIS_ROOT}/include" "${METIS_ROOT}/install/lib"
          ln -sf /usr/include/metis.h "${METIS_ROOT}/include/metis.h"
          METIS_LIB="$(ldconfig -p | awk '/libmetis\.so/{print $NF; exit}')"
          test -n "${METIS_LIB}"
          ln -sf "${METIS_LIB}" "${METIS_ROOT}/install/lib/libmetis.so"

          DQ_MESH_DIR="${RUNNER_TEMP}/DQ_data"
          mkdir -p "${DQ_MESH_DIR}"

          cat > config/hpc.local.mk <<EOF
          MPMC_PLATFORM := local
          PETSC_DIR := ${PETSC_DIR}
          PETSC_ARCH := ${PETSC_ARCH}
          FMT_DIR := /usr
          METIS_DIR := ${METIS_ROOT}
          VTK_INSTALL :=
          X11_LIB_DIR := /usr/lib/x86_64-linux-gnu
          LOCAL_LIB_DIR := /usr/local/lib
          MPI_LAUNCHER := mpiexec
          MPI_LAUNCHER_ARGS :=
          MODULES_ENABLED := 0
          PETSC_CUSTOM_HOOK_LINKAGE := both
          MPI_MODULE :=
          BLAS_MODULE :=
          SBATCH :=
          DQ_MESH_DIR := ${DQ_MESH_DIR}
          EOF

          make print-config
          make doctor-local

      - name: Repository audit and unit tests
        run: |
          make audit || echo '::warning::Slim handoff omits generated documentation figures; continuing to executable gates.'
          make unit-gcc

      - name: Build representative cases
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^clean::$/mpmc-ci-clean:/' case/Makefile

          python3 - <<'PY'
          from pathlib import Path
          path = Path('case/h2o_co2_nc10_2d_traditional/h2o_co2_nc10_2d_traditional.cpp')
          text = path.read_text()
          old = '''void initializeSolution(
              Grid &grid, Vec solution, const MPMC::FluidSystem<Indices> &fluid)
          {
              const auto unified = unifiedBinaryInitialSaturation(fluid);
              PetscCallAbort(PETSC_COMM_WORLD, VecSet(solution, 0.0));'''
          new = '''void initializeSolution(
              Grid &grid, Vec solution, const MPMC::FluidSystem<Indices> &fluid)
          {
          #ifdef MPMC_H2O_CO2_BINARY_INITIAL_H2O_MOLE_FRACTION
              const auto unified = unifiedBinaryInitialSaturation(fluid);
          #else
              (void)fluid;
          #endif
              PetscCallAbort(PETSC_COMM_WORLD, VecSet(solution, 0.0));'''
          if old not in text:
              raise SystemExit('expected traditional-case initialization block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          make case CASE=h2o_co2_nc10_2d_traditional -j2
          make case CASE=h2o_co2_nc10_2d_benchmark -j2

      - name: Run traditional short step
        id: traditional
        continue-on-error: true
        run: |
          make run CASE=h2o_co2_nc10_2d_traditional NP=1 \
            RESULT_DIR="${GITHUB_WORKSPACE}/runner-results/traditional" \
            RUN_ARGS='-numSteps 1 -dt 0.01 -adaptive_dt false'

      - name: Run New-PR short step
        id: pr
        continue-on-error: true
        run: |
          make run CASE=h2o_co2_nc10_2d_benchmark NP=1 EOS=pr \
            RESULT_DIR="${GITHUB_WORKSPACE}/runner-results/new-pr" \
            RUN_ARGS='-numSteps 1 -dt 0.01 -adaptive_dt false'

      - name: Run New-SW short step
        id: sw
        continue-on-error: true
        run: |
          make run CASE=h2o_co2_nc10_2d_benchmark NP=1 EOS=sw \
            RESULT_DIR="${GITHUB_WORKSPACE}/runner-results/new-sw" \
            RUN_ARGS='-numSteps 1 -dt 0.01 -adaptive_dt false'

      - name: Run New-CPA short step
        id: cpa
        continue-on-error: true
        run: |
          make run CASE=h2o_co2_nc10_2d_benchmark NP=1 EOS=cpa \
            RESULT_DIR="${GITHUB_WORKSPACE}/runner-results/new-cpa" \
            RUN_ARGS='-numSteps 1 -dt 0.01 -adaptive_dt false'

      - name: Summarize generated outputs
        if: always()
        run: |
          echo '=== result files ==='
          find runner-results -maxdepth 3 -type f -print 2>/dev/null | sort || true
          echo '=== case logs ==='
          find case/h2o_co2_nc10_2d_* -path '*/logs/*' -type f -print 2>/dev/null | sort || true

      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2o-co2-nc10-smoke-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            runner-results/
            case/h2o_co2_nc10_2d_traditional/logs/
            case/h2o_co2_nc10_2d_benchmark/logs/

      - name: Enforce numerical smoke outcomes
        if: always()
        shell: bash
        run: |
          echo "traditional=${{ steps.traditional.outcome }}"
          echo "pr=${{ steps.pr.outcome }}"
          echo "sw=${{ steps.sw.outcome }}"
          echo "cpa=${{ steps.cpa.outcome }}"
          failed=0
          for outcome in \
            "${{ steps.traditional.outcome }}" \
            "${{ steps.pr.outcome }}" \
            "${{ steps.sw.outcome }}" \
            "${{ steps.cpa.outcome }}"; do
            [[ "${outcome}" == "success" ]] || failed=1
          done
          exit "${failed}"
