name: Minority phase amount coordinate apply

on:
  push:
    branches:
      - fix/minority-oil-phase-amount-20260917
    paths:
      - .github/workflows/minority-phase-amount-apply.yml

permissions:
  contents: write

jobs:
  apply-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/minority-oil-phase-amount-20260917
          fetch-depth: 0

      - name: Install unit-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libfmt-dev

      - name: Apply minority-phase coordinate patch
        run: |
          python3 tools/apply_minority_amount_patch.py
          git diff --check

      - name: Run full unit suite
        run: |
          make -C test clean || true
          make -C test -j2 unit FMT_DIR=/usr CXX=g++
          make -C test run-unit FMT_DIR=/usr CXX=g++

      - name: Commit validated implementation
        run: |
          rm -f tools/apply_minority_amount_patch.py
          rm -f .github/workflows/minority-phase-amount-apply.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use continuous oil phase-amount composition coordinates"
          git push origin HEAD:fix/minority-oil-phase-amount-20260917
