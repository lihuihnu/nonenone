name: Apply verified CPA root-policy split
on:
  push:
    branches: [docs/scw-kerogen-acs2023-data]
    paths: ['.github/workflows/scw-root-policy-apply.yml']
permissions:
  contents: write
jobs:
  apply-verified-patch:
    if: github.repository == 'lihuihnu/nonenone'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Check and apply the exact locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          patch=tools/example/cpa_athabasca_bitumen_water/root_policy_split.patch
          echo "0c41528f0f03230365d67a044db1c5d57bd0eed4bc66e30fa5874fe0bd0c2aa5  $patch" | sha256sum --check
          git apply --check --index "$patch"
          git apply --index "$patch"
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          mkdir -p /tmp/root-policy-verified
          git diff --cached > /tmp/root-policy-verified/applied.patch
          git rev-parse HEAD > /tmp/root-policy-verified/source_parent.txt
      - name: Require all five root-branch certificates and full failure-mode regression
        shell: bash
        run: |
          set -euo pipefail
          flags='-std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Iad/include -Icommon/include -Iindices/include -Imodels/include -Icase/include -Itest/include -Itools/include'
          g++ $flags tools/example/cpa_athabasca_bitumen_water/branch_consistency_probe.cpp -o /tmp/branch_probe
          /tmp/branch_probe /tmp/root-policy-verified/branch | tee /tmp/root-policy-verified/branch.log
          g++ $flags test/src/unit/thermodynamic_failure_modes_test.cpp -o /tmp/failure_modes
          /tmp/failure_modes | tee /tmp/root-policy-verified/failure_modes.log
      - name: Commit the verified five-file change without force-push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(cpa): preserve active roots and separate candidate Gibbs validation'
          git rev-parse HEAD | tee /tmp/root-policy-verified/verified_commit.txt
          git push origin HEAD:refs/heads/docs/scw-kerogen-acs2023-data
      - name: Upload verification and commit provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpa-root-policy-verified
          path: /tmp/root-policy-verified/
          if-no-files-found: error
